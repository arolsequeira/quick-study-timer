<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>quick-study-timer</title>
  <meta name="description" content="Minimal browser study timer with local session history and a Python stats helper.">
  <meta property="og:title" content="quick-study-timer">
  <meta property="og:description" content="Minimal browser study timer with local session history and a Python stats helper.">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main class="shell">
    <header class="top-bar">
      <h1>quick-study-timer</h1>
      <div class="modes">
        <button data-mode="focus" class="active">Focus</button>
        <button data-mode="break">Break</button>
      </div>
    </header>
    <section class="timer-card">
      <div id="clock" class="clock">25:00</div>
      <div class="controls">
        <input id="minutesInput" type="number" min="1" max="120" placeholder="25">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
      </div>
    </section>
    <section class="log-card">
      <h2>Session Log</h2>
      <ul id="sessionList"></ul>
    </section>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
